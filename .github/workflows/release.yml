name: Build and release ClickTrack

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (three numbers, for example 1.0.0)'
        required: true
        default: '1.0.0'
      publish:
        description: 'Publish all verified platforms as a GitHub release'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          version="${REQUESTED_VERSION#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Use a version such as 1.0.0.' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: source/requirements*.txt
      - name: Install build and test tools
        run: python -m pip install -r source/requirements-dev.txt
      - name: Fetch and verify exact decoder source
        run: python source/Fetch-Decoder-Source.py
      - uses: actions/cache@v4
        id: decoder-cache
        with:
          path: work/decoder
          key: decoder-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('source/decoder-source.json', 'source/Build-Decoder.sh') }}
      - uses: msys2/setup-msys2@v2
        if: steps.decoder-cache.outputs.cache-hit != 'true'
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            diffutils
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-nasm
      - name: Build native decoder
        if: steps.decoder-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash source/Build-Decoder.sh work/decoder-source/ffmpeg-9.0.1.tar.xz
      - name: Refresh native license notices
        run: python source/Collect-Release-Licenses.py
      - name: Run application tests
        run: python -m pytest tests -q
      - name: Build standalone Windows application
        shell: pwsh
        run: |
          $decoder = Join-Path $PWD 'work/decoder/bin/ffmpeg.exe'
          $python = (Get-Command python).Source
          ./source/Build.ps1 -FfmpegPath $decoder -PythonPath $python
      - name: Check packaged application
        shell: pwsh
        run: |
          $process = Start-Process -FilePath './work/dist/ClickTrack/ClickTrack.exe' -ArgumentList '--self-test','--self-test-report',"$PWD/work/windows-smoke.json" -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Packaged app startup timed out.' }
          if (Test-Path work/windows-smoke.json) { Get-Content work/windows-smoke.json }
          if ($process.ExitCode -ne 0) { throw 'Packaged app smoke test failed.' }
      - name: Create portable ZIP
        shell: pwsh
        run: ./source/Package-Release.ps1 -Version '${{ needs.version.outputs.version }}' -PythonPath (Get-Command python).Source
      - name: Check clean extracted download
        shell: pwsh
        run: |
          $zip = Get-ChildItem outputs/*windows-x64.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath work/extracted
          $exe = Get-ChildItem work/extracted -Recurse -Filter ClickTrack.exe | Select-Object -First 1
          $process = Start-Process -FilePath $exe.FullName -ArgumentList '--self-test','--self-test-report',"$PWD/work/windows-extracted-smoke.json" -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Extracted app startup timed out.' }
          if (Test-Path work/windows-extracted-smoke.json) { Get-Content work/windows-extracted-smoke.json }
          if ($process.ExitCode -ne 0) { throw 'Extracted app smoke test failed.' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-smoke-reports
          path: work/*smoke.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64
          path: outputs/*
          if-no-files-found: error
          compression-level: 0

  mac:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    env:
      QT_QPA_PLATFORM: offscreen
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      CLICKTRACK_MAC_MIN_VERSION: '14.0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: source/requirements*.txt
      - name: Install build and test tools
        run: python -m pip install -r source/requirements-dev.txt
      - name: Fetch and verify exact decoder source
        run: python source/Fetch-Decoder-Source.py
      - uses: actions/cache@v4
        id: decoder-cache
        with:
          path: work/decoder
          key: decoder-${{ runner.os }}-${{ runner.arch }}-mac14-${{ hashFiles('source/decoder-source.json', 'source/Build-Decoder.sh') }}
      - name: Build native decoder
        if: steps.decoder-cache.outputs.cache-hit != 'true'
        run: bash source/Build-Decoder.sh work/decoder-source/ffmpeg-9.0.1.tar.xz
      - name: Refresh native license notices
        run: python source/Collect-Release-Licenses.py
      - name: Run application tests
        run: python -m pytest tests -q
      - name: Build standalone Mac application and ZIP
        run: |
          export CLICKTRACK_FFMPEG="$PWD/work/decoder/bin/ffmpeg"
          export CLICKTRACK_PYTHON="$(command -v python)"
          bash source/Build-Mac.sh '${{ needs.version.outputs.version }}' '${{ matrix.architecture }}'
      - name: Check packaged app and extracted download
        run: |
          work/dist/ClickTrack.app/Contents/MacOS/ClickTrack --self-test --self-test-report "$PWD/work/mac-smoke.json"
          cat work/mac-smoke.json
          mkdir -p work/extracted
          ditto -x -k "outputs/ClickTrack-${{ needs.version.outputs.version }}-macos-${{ matrix.architecture }}.zip" work/extracted
          app="work/extracted/ClickTrack-${{ needs.version.outputs.version }}-macos-${{ matrix.architecture }}/ClickTrack.app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/ClickTrack" --self-test --self-test-report "$PWD/work/mac-extracted-smoke.json"
          cat work/mac-extracted-smoke.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-${{ matrix.architecture }}-smoke-reports
          path: work/*smoke.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.architecture }}
          path: outputs/*
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [version, windows, mac]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: outputs
          pattern: 'release-*'
          merge-multiple: true
      - name: Include exact decoder source and checksums
        run: |
          python source/Fetch-Decoder-Source.py
          cp work/decoder-source/ffmpeg-9.0.1.tar.xz outputs/
          cp source/Build-Decoder.sh outputs/ClickTrack-FFmpeg-build-recipe.sh
          cd outputs
          sha256sum *.zip *.tar.xz *.sh > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" outputs/* --target "$GITHUB_SHA" --title "ClickTrack $VERSION" --notes-file release-notes.md --latest
